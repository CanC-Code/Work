name: Build and Quantize TAESD GGUF
on: [workflow_dispatch]

jobs:
  build-and-quantize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable-diffusion.cpp
        uses: actions/checkout@v4
        with:
          repository: leejet/stable-diffusion.cpp
          ref: master
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl

      - name: Build sd-cli
        run: |
          mkdir build && cd build
          cmake .. -DSD_BUILD_EXAMPLES=ON
          cmake --build . --config Release -j $(nproc)

      - name: Download Official TAESD (Decoder Only)
        run: |
          # We download the specific decoder for SD 1.5
          curl -L -o taesd_decoder.safetensors "https://huggingface.co/madebyollin/taesd/resolve/main/taesd_decoder.safetensors?download=true"

      - name: Convert and Quantize to GGUF
        run: |
          # The -v flag ensures we treat it as a VAE/TAESD type
          # We use q8_0 because it's only 10MB and prevents artifacts on your Moto G Play
          ./build/bin/sd-cli -M convert -m taesd_decoder.safetensors -o taesd_v15_q8_0.gguf --type q8_0

      - name: Upload TAESD GGUF
        uses: actions/upload-artifact@v4
        with:
          name: taesd-gguf-output
          path: taesd_v15_q8_0.gguf
